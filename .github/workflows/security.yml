name: Security audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # New advisories appear without code changes, so audit weekly as well.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: 'pip'
    - name: Install
      run: |
        pip install --upgrade pip
        pip install -c constraints-ci.txt .[dev]
    - name: Audit installed dependencies
      run: python -m pip_audit --progress-spinner off
