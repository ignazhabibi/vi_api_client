name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install
      run: |
        pip install --upgrade pip
        pip install -c constraints-ci.txt .[dev]
    - name: Quality check
      run: python scripts/quality_check.py

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: 'pip'
    - name: Install lowest supported dependencies
      run: |
        pip install --upgrade pip
        pip install -c constraints-ci-lowest.txt .[dev]
    - name: Test
      run: python -m pytest -q

  release:
    needs: quality-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Build
      run: |
        pip install -c constraints-ci.txt .[dev]
        python -m build
    - name: Read Release Notes
      id: release_notes
      env:
        TAG: ${{ github.ref_name }}
      # The release PR adds release-notes/<tag>.md, so a tag created on the
      # GitHub release page works. An annotated tag's message is the fallback;
      # a lightweight tag has no message of its own, so the job fails rather
      # than publish the commit message as release notes.
      run: |
        NOTES_FILE="release-notes/${TAG}.md"
        if [ -f "$NOTES_FILE" ]; then
          NOTES=$(cat "$NOTES_FILE")
        else
          git fetch --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::Missing $NOTES_FILE, and $TAG is not an annotated tag"
            exit 1
          fi
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG")
        fi
        DELIMITER="RELEASE_NOTES_$(date +%s%N)"
        {
          echo "body<<${DELIMITER}"
          echo "$NOTES"
          echo "${DELIMITER}"
        } >> "$GITHUB_OUTPUT"
    - name: GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        body: ${{ steps.release_notes.outputs.body }}
        generate_release_notes: false
