name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Manual run that publishes the current ref to TestPyPI (see CONTRIBUTING.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install
      run: |
        pip install --upgrade pip
        pip install -c constraints-ci.txt .[dev]
    - name: Quality check
      run: python scripts/quality_check.py

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        cache: 'pip'
    - name: Install lowest supported dependencies
      run: |
        pip install --upgrade pip
        pip install -c constraints-ci-lowest.txt .[dev]
    - name: Test
      run: python -m pytest -q

  build:
    needs: quality-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"
    - name: Verify tag matches package version
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "v${VERSION}" != "${TAG}" ]; then
          echo "::error::Tag ${TAG} does not match the package version ${VERSION} in pyproject.toml"
          exit 1
        fi
    - name: Build
      run: |
        pip install -c constraints-ci.txt .[dev]
        python -m build
    # The same files are published to the index and attached to the GitHub
    # release, so neither can drift from the other.
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # Trusted publishing: the "testpypi" environment is registered as a trusted
  # publisher on test.pypi.org, so no API token is stored in the repository.
  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/vi-api-client/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  # Trusted publishing: the "pypi" environment is registered as a trusted
  # publisher on pypi.org. Configure required reviewers on the environment to
  # gate each upload, because a published version can never be replaced.
  publish-pypi:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vi-api-client/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Read Release Notes
      id: release_notes
      env:
        TAG: ${{ github.ref_name }}
      # The release PR adds release-notes/<tag>.md, so a tag created on the
      # GitHub release page works. An annotated tag's message is the fallback;
      # a lightweight tag has no message of its own, so the job fails rather
      # than publish the commit message as release notes.
      run: |
        NOTES_FILE="release-notes/${TAG}.md"
        if [ -f "$NOTES_FILE" ]; then
          NOTES=$(cat "$NOTES_FILE")
        else
          git fetch --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::Missing $NOTES_FILE, and $TAG is not an annotated tag"
            exit 1
          fi
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG")
        fi
        DELIMITER="RELEASE_NOTES_$(date +%s%N)"
        {
          echo "body<<${DELIMITER}"
          echo "$NOTES"
          echo "${DELIMITER}"
        } >> "$GITHUB_OUTPUT"
    - name: GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        body: ${{ steps.release_notes.outputs.body }}
        generate_release_notes: false
